name: Pylint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.8 and 3.9 are gone from ubuntu-latest, and current pylint needs 3.10+.
        # The scripts use python3 with postponed annotations and no 3.13-only syntax.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint==4.1.3
      - name: Analysing the code with pylint
        shell: bash
        run: |
          mapfile -t files < <(git ls-files '*.py')
          if (( ${#files[@]} == 0 )); then
            echo "No tracked Python files; skipping pylint."
            exit 0
          fi
          pylint "${files[@]}"
